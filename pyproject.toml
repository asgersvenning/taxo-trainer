[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxo-trainer"
version = "0.1.1"
description = "Modernized species & higher-rank taxonomy training engine powered by GBIF DarwinCore datasets."
readme = "README.md"
authors = [
    { name = "Taxo-Trainer Development Team" }
]
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "pywebview>=5.0.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
taxo-trainer = "taxo_trainer.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taxo_trainer"]

[tool.uv]
package = true
